<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#151922">
<title>Agenda • Barbearia Nicácio</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="barbeiro.css?v=33">
</head>
<body>
<main class="barber-app">
  <header class="barber-top">
    <div class="hello-block">
      <h1>Olá, <span id="barberName">Nicácio</span></h1>
      <button id="agendaSelector" class="agenda-selector">Você está em sua agenda. <span>▾</span></button>
    </div>
    <div class="top-actions">
      <button id="togglePrivacy" class="icon-btn" aria-label="Ocultar valores">◉</button>
      <button id="openMenu" class="icon-btn" aria-label="Abrir menu">☰</button>
    </div>
  </header>

  <section class="week-head">
    <div class="week-title-row">
      <button id="prevWeek" class="nav-arrow" aria-label="Semana anterior">‹</button>
      <div class="week-title">📅 <span id="weekRange"></span></div>
      <button id="nextWeek" class="nav-arrow" aria-label="Próxima semana">›</button>
    </div>
    <div id="weekDays" class="week-days"></div>
  </section>

  <section class="stats-grid">
    <article class="stat-card stat-today">
      <div><strong>Hoje</strong><span class="money-line"><span class="coin-icon" aria-hidden="true">🪙</span><b id="todayRevenue">R$ 0,00</b></span></div>
      <div class="stat-number" id="todayCount">0</div><div class="chair barber-chair" aria-hidden="true"><svg viewBox="0 0 64 64"><rect x="20" y="8" width="24" height="26" rx="7"/><rect x="15" y="29" width="34" height="12" rx="6"/><path d="M32 41v10M22 55h20M18 59h28"/><path d="M18 35l-7 7M46 35l7 7"/></svg></div>
    </article>
    <article class="stat-card stat-week">
      <div><strong>Esta semana</strong><span class="money-line"><span class="coin-icon" aria-hidden="true">🪙</span><b id="weekRevenue">R$ 0,00</b></span></div>
      <div class="stat-number" id="weekCount">0</div><div class="chair barber-chair" aria-hidden="true"><svg viewBox="0 0 64 64"><rect x="20" y="8" width="24" height="26" rx="7"/><rect x="15" y="29" width="34" height="12" rx="6"/><path d="M32 41v10M22 55h20M18 59h28"/><path d="M18 35l-7 7M46 35l7 7"/></svg></div>
    </article>
  </section>

  <section class="timeline-wrap">
    <div class="timeline-top">
      <div><h2 id="selectedDayTitle">Agenda de hoje</h2><p id="selectedDaySub">Horários e clientes do dia selecionado</p></div>
      <button id="editDayBtn" class="mini-btn">Modificar este dia</button>
    </div>
    <div id="timeline" class="timeline"></div>
    <div class="day-edit-footer">
      <button id="editDayBtnBottom" class="day-only-btn">MODIFICAR APENAS ESTE DIA</button>
      <p class="business-hours" id="businessHoursText"></p>
      <button id="editHoursLink" class="edit-hours-link" type="button">Editar horários</button>
      <div class="app-version">Versão Barbearia Nicácio</div>
      <button id="scrollTopRef" class="scroll-top-ref" type="button" aria-label="Voltar ao topo">⌃</button>
    </div>
  </section>

  <div class="bottom-spacer"></div>
  <div class="bottom-actions">
    <button id="lockDayBtn" class="lock-btn" aria-label="Bloquear dia">🔒</button>
    <button id="newBookingBtn" class="new-booking-btn">Novo Agendamento <span>→</span></button>
  </div>
</main>

<aside id="sideMenu" class="side-menu hidden" aria-hidden="true">
  <div class="menu-head-ref">
    <button id="closeMenu" class="menu-close-ref" aria-label="Fechar menu">✕</button>
    <div class="menu-logo-ref">NICÁCIO</div>
  </div>
  <nav class="menu-list menu-list-ref">
    <button data-page="link">Meu link</button>
    <button data-page="services">Serviços e preços</button>
    <button data-page="clients">Clientes</button>
    <button data-page="cancelled">Cancelados</button>
    <button data-page="recurrence">Minhas recorrências</button>
    <button data-page="revenue">Faturamento</button>
    <button data-page="help">Ajuda p/ configurar</button>
    <button data-page="report">Reportar erro</button>
    <button data-page="rate">Avaliar app</button>
    <button data-page="settings">Configurações</button>
  </nav>
</aside>
<div id="menuOverlay" class="menu-overlay hidden"></div>

<section id="modal" class="modal hidden" aria-hidden="true">
  <div class="modal-card">
    <div class="modal-head"><h2 id="modalTitle">Painel</h2><button id="closeModal" class="icon-btn" aria-label="Fechar">✕</button></div>
    <div id="modalContent"></div>
  </div>
</section>

<div id="toast" class="toast hidden" role="status"></div>
<script src="barbeiro.js?v=33"></script>
</body>
</html>
