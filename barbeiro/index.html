<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#151922">
<title>Agenda • Barbearia Nicácio</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="barbeiro.css?v=4">
</head>
<body>
<main class="barber-app">
  <header class="barber-top">
    <div class="hello-block">
      <h1>Olá, <span id="barberName">Nicácio</span></h1>
      <button id="agendaSelector" class="agenda-selector">Você está em sua agenda. <span>▾</span></button>
    </div>
    <div class="top-actions">
      <button id="togglePrivacy" class="icon-btn" aria-label="Ocultar valores">◉</button>
      <button id="openMenu" class="icon-btn" aria-label="Abrir menu">☰</button>
    </div>
  </header>

  <section class="week-head">
    <div class="week-title-row">
      <button id="prevWeek" class="nav-arrow" aria-label="Semana anterior">‹</button>
      <div class="week-title">📅 <span id="weekRange"></span></div>
      <button id="nextWeek" class="nav-arrow" aria-label="Próxima semana">›</button>
    </div>
    <div id="weekDays" class="week-days"></div>
  </section>

  <section class="stats-grid">
    <article class="stat-card stat-today">
      <div><strong>Hoje</strong><span class="money-line"><b id="todayRevenue">R$ 0,00</b></span></div>
      <div class="stat-number" id="todayCount">0</div><div class="chair">♟</div>
    </article>
    <article class="stat-card stat-week">
      <div><strong>Esta semana</strong><span class="money-line"><b id="weekRevenue">R$ 0,00</b></span></div>
      <div class="stat-number" id="weekCount">0</div><div class="chair">♟</div>
    </article>
  </section>

  <section class="timeline-wrap">
    <div class="timeline-top">
      <div><h2 id="selectedDayTitle">Agenda de hoje</h2><p id="selectedDaySub">Horários e clientes do dia selecionado</p></div>
      <button id="editDayBtn" class="mini-btn">Modificar este dia</button>
    </div>
    <div id="timeline" class="timeline"></div>
  </section>

  <div class="bottom-spacer"></div>
  <div class="bottom-actions">
    <button id="lockDayBtn" class="lock-btn" aria-label="Bloquear dia">🔒</button>
    <button id="newBookingBtn" class="new-booking-btn">Novo Agendamento <span>→</span></button>
  </div>
</main>

<aside id="sideMenu" class="side-menu hidden" aria-hidden="true">
  <div class="menu-head"><div><div class="menu-logo">NICÁCIO</div><small>Painel do profissional</small></div><button id="closeMenu" class="icon-btn" aria-label="Fechar menu">✕</button></div>
  <nav class="menu-list">
    <button data-page="link"><span>🔗</span> Meu link</button>
    <button data-page="services"><span>✂️</span> Serviços e preços</button>
    <button data-page="clients"><span>👥</span> Clientes</button>
    <button data-page="cancelled"><span>✖</span> Cancelados</button>
    <button data-page="recurrence"><span>↻</span> Minhas recorrências</button>
    <button data-page="revenue"><span>💰</span> Faturamento</button>
    <button data-page="settings"><span>⚙️</span> Configurações</button>
  </nav>
</aside>
<div id="menuOverlay" class="menu-overlay hidden"></div>

<section id="modal" class="modal hidden" aria-hidden="true">
  <div class="modal-card">
    <div class="modal-head"><h2 id="modalTitle">Painel</h2><button id="closeModal" class="icon-btn" aria-label="Fechar">✕</button></div>
    <div id="modalContent"></div>
  </div>
</section>

<div id="toast" class="toast hidden" role="status"></div>
<script src="barbeiro.js?v=4"></script>
</body>
</html>
